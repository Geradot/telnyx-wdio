name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Show preinstalled browser versions (informational)
        continue-on-error: true
        run: |
          which google-chrome || which google-chrome-stable || which chromium-browser || true
          (google-chrome --version || google-chrome-stable --version || chromium-browser --version) || true
          chromedriver --version || true

      - name: Install dependencies
        run: npm install

      - name: Run headless tests (chrome)
        env:
          BROWSER: chrome
          HEADLESS: "true"
        run: npm run test:headless

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: warn

  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Setup Java for Allure
        if: always()
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 25

      - name: Install Allure CLI 
        if: always()
        run: npm install -g allure-commandline

      - name: Generate Allure Report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
